<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- v1.3.0 §3：背景ぼかしの被写体切り抜き（POST と同じ MediaPipe）を読み込むためだけに、固定バージョンのライブラリとモデルの置き場所に限って取得を許可する（データは送らない） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval' https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/ https://accounts.google.com/gsi/client; worker-src blob: https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/; style-src 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; img-src data: blob:; media-src blob: mediastream:; connect-src https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/ https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite https://accounts.google.com/gsi/ https://www.googleapis.com/drive/v3/ https://www.googleapis.com/upload/drive/v3/; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>セラー</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
/* v1.1.0 モノクロ基調：白・黒・グレーのみ。赤（--dan）は削除・全置換など危険操作のボタンだけに使う */
:root{--bg:#f4f4f4;--card:#fff;--line:#dedede;--line2:#c8c8c8;--ink:#111;--sub:#4d4d4d;--mute:#8a8a8a;--soft:#f0f0f0;--dan:#b3261e;--tabh:60px}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
/* v1.2.0 §1 iOS Safari の自動ズーム対策：入力欄は16px以上（16px未満だとフォーカス時に拡大される）。ダブルタップ拡大も抑止 */
input,select,textarea{font-size:16px!important}
html{touch-action:manipulation;scroll-padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom))}
a,button,input,select,textarea,label,summary,[data-act]{touch-action:manipulation}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-height:42px;min-width:0;max-width:100%}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.35;cursor:default}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{font-size:17px;font-weight:700;letter-spacing:.2px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{padding:12px 12px calc(var(--tabh) + 24px + env(safe-area-inset-bottom));max-width:100%;overflow-x:hidden}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{height:var(--tabh);border:0;background:none;font-size:10.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;white-space:nowrap;overflow:hidden}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--ink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;min-width:0}
.card h2{font-size:15px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.dan{background:#fff;border-color:var(--dan);color:var(--dan);font-weight:600}
.btn.sm{padding:4px 10px;min-height:34px;font-size:13px}
.btn.wide{width:100%}
.muted{color:var(--mute);font-size:13px}
.neg,.pos{color:inherit}
.strong{font-weight:800}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mnav b{font-size:17px}
table.sum{width:100%;border-collapse:collapse;table-layout:fixed}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:9px 4px;text-align:right;font-variant-numeric:tabular-nums}
table.sum th{text-align:left;color:var(--sub);font-weight:500}
table.sum tr.key td{font-weight:800;font-size:17px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--sub);margin:4px 0 6px}
.legend svg{width:22px;height:8px;vertical-align:middle;margin-right:4px}
#chartTip{font-size:13px;color:var(--sub);min-height:20px;font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block;touch-action:manipulation}
input.search,.f input,.f select,.f textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;background:#fff;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.f{margin-bottom:10px;min-width:0}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.f2>.f{min-width:0}
.grp{font-size:13px;font-weight:700;color:var(--ink);margin:16px 2px 6px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.srow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;min-width:0}
.srow.est{border-style:dashed}
.srow .th,.cell .th{background:var(--soft) center/cover no-repeat;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:9px;font-weight:600;letter-spacing:.5px;overflow:hidden}
.srow .th{width:52px;height:52px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.srow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:2px}
.srow .meta .pf{font-weight:800;color:var(--ink)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);background:var(--soft);color:var(--sub);white-space:nowrap}
.badge.estl{background:#fff;border-style:dashed;color:var(--ink)}
.stbtn{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);white-space:nowrap}
button.stbtn{min-height:26px}
.stbtn.done{border-color:var(--line2);color:var(--sub);background:var(--soft)}
.six{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.six div{display:flex;justify-content:space-between;gap:4px;min-width:0}
.six span{color:var(--mute);white-space:nowrap}
.six b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.six b.pf{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:16px;padding:5px 11px;font-size:13px;min-height:32px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0;padding:0;text-align:left;color:var(--ink)}
.cell .th{width:100%;aspect-ratio:1/1;border-radius:0}
.cell .lb{padding:4px 6px}
.cell .pr{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cell .cn{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:30px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-padding-top:70px;scroll-padding-bottom:90px}
#sheet .sh{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px 6px 6px;padding-top:calc(6px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px}
#sheet .sh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
/* §5 閉じるボタン：タップ領域 48px・字 28px */
.xbtn{flex:none;width:48px;height:48px;border:0;background:none;color:var(--ink);font-size:28px;line-height:1;font-weight:300;display:flex;align-items:center;justify-content:center;border-radius:8px;padding:0}
.xbtn:active{background:var(--soft)}
#sheet .body{padding:12px 12px 110px}
.sec{font-size:12px;font-weight:700;color:var(--sub);margin:4px 0 8px;letter-spacing:.3px}
.bigp{text-align:center;padding:12px;border-radius:10px;background:var(--soft);margin:6px 0 4px}
.bigp .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:21;display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto;min-width:0}
#modal .box h3{margin:0 0 8px;font-size:16px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#modal video{width:100%;border-radius:8px;background:#000;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 84px);z-index:50;background:#111;color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;width:max-content;max-width:90vw;pointer-events:none}
.chset{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:end;margin-bottom:8px}
.chset .f{margin:0}
.empty-note{text-align:center;color:var(--mute);padding:30px 0}
.warn{font-weight:700}
/* §1 ツールの切り替え */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:9px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:#fff;color:var(--ink);min-height:40px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
/* §2 定型文 */
.tpl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;min-width:0}
.tpl .tb{min-width:0;cursor:pointer}
.tpl .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl .td{font-size:13px;color:var(--sub);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tpl .hint{font-size:11px;color:var(--mute);margin-top:4px;word-break:break-all}
.tpl .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tpl .side .r2{display:flex;gap:2px}
.star{border:0;background:none;font-size:20px;line-height:1;width:36px;height:34px;padding:0;color:var(--mute)}
.star.on{color:var(--ink)}
.lnk{border:0;background:none;font-size:13px;color:var(--sub);text-decoration:underline;min-height:34px;padding:0 6px}
.pv{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:8px;padding:10px;font-size:13px;max-height:30vh;overflow:auto}
/* §3 計算 */
.cr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,8.5em) 1.6em;align-items:center;gap:6px;min-height:40px;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.cr .lb{font-size:14px;color:var(--sub);min-width:0}
.cr input{width:100%;min-width:0;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;text-align:right;height:34px;background:#fff;font-variant-numeric:tabular-nums}
.cr .u{font-size:12px;color:var(--mute)}
.cr .val{grid-column:2/4;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cr .val.big{font-size:22px;font-weight:800}
.cbtns{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}
.cnote{font-size:12px;color:var(--mute);margin-top:6px}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;min-width:0}
details.fold>summary{padding:12px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;min-width:0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--sub);flex:none}
details.fold[open]>summary::after{content:"－"}
details.fold>.in{padding:0 12px 12px}
/* v1.2.0 §2 在庫タブ */
.invtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px}
.invsum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:13px;color:var(--sub);margin-bottom:6px;font-variant-numeric:tabular-nums}
.invsum b{color:var(--ink)}
.cell{position:relative}
.cell .bd{position:absolute;left:4px;top:4px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .ck{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);box-shadow:0 0 0 1px var(--ink)}
.cell.sel{outline:3px solid var(--ink);outline-offset:-3px}
.cell.sel .ck{background:var(--ink)}
.cell.sel .ck::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cell.off{opacity:.35}
.selbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:8;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--ink)}
.selbar span{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist{border-top:1px solid var(--line)}
.mlist div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.mlist div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist div span:last-child{flex:none;font-variant-numeric:tabular-nums}
/* v1.3.0 §1 月別推移グラフの色（グラフ限定の例外。凡例も同じ色） */
.legend .sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
/* v1.3.0 §2 読み取りで登録：SSS 台帳版の CSS（.banner/#cam/.sec/.fld/.grid3/.inline-in/.note/.btn/.row/.scanbtn）を #sheet.sss の中だけに適用。
   色だけはセラーのモノクロに合わせる（SSS の黄系バナー・赤いガイド線・緑の読み取り枠 → 白黒） */
#sheet.sss{--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--r-lg:18px;--r-md:12px;--r-sm:9px;--fs-sec:12px;--fs-sheet:17px;--h-btn:44px;--h-input:44px;--line2s:#dededa;--mut:#77776f;--mut2:#9a9a94;--safe:env(safe-area-inset-bottom,0px)}
#sheet.sss .sh{display:flex;align-items:center;gap:var(--sp2);padding:calc(env(safe-area-inset-top,0px) + var(--sp3)) 16px var(--sp3);border-bottom:1px solid var(--line);background:#fbfbfa}
#sheet.sss .sh h2{font-size:var(--fs-sheet);margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet.sss .sb{padding:var(--sp3) 16px calc(30px + var(--safe))}
#sheet.sss .row{display:flex;gap:8px;align-items:center}
#sheet.sss .btn{background:#fff;border:1px solid var(--line2s);border-radius:var(--r-md);height:var(--h-btn);min-height:0;padding:0 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#141414}
#sheet.sss .btn.pri{background:#141414;border-color:#141414;color:#fff}
#sheet.sss .btn.sm{height:34px;padding:0 11px;font-size:12.5px;border-radius:var(--r-sm)}
#sheet.sss .btn.wide{width:100%}
#sheet.sss .btn:disabled{opacity:.45}
#sheet.sss .banner{margin:0;padding:10px 12px;border-radius:12px;background:#f2f2f0;border:1px solid #c8c8c8;color:#141414;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(20,20,20,.12)}
#sheet.sss .banner button{margin-left:auto;background:#141414;border:0;border-radius:9px;padding:7px 11px;color:#fff;white-space:nowrap;font-weight:700;font-size:12.5px}
#sheet.sss #cam{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#1b1b1e;margin-bottom:var(--sp2);height:170px}
#sheet.sss #cam video{width:100%;height:100%;object-fit:cover;display:block}
#sheet.sss #cam .guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.9)}
#sheet.sss #cam .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000}
#sheet.sss #cam.hit{outline:4px solid #fff;outline-offset:-4px}
#sheet.sss .sec{font-size:var(--fs-sec);font-weight:800;letter-spacing:.05em;color:#55554f;margin:18px 2px 6px}
#sheet.sss .fld{margin-bottom:var(--sp3)}
#sheet.sss .fld label{display:block;font-size:11px;color:var(--mut2);font-weight:700;letter-spacing:.04em;margin-bottom:var(--sp1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet.sss .fld input{width:100%;min-width:0;max-width:100%;background:#fff;border:1px solid var(--line2s);border-radius:var(--r-md);height:var(--h-input);padding:0 var(--sp2);font-size:16px}
#sheet.sss .fld input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;line-height:var(--h-input);text-align:left}
#sheet.sss .fld input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
#sheet.sss .grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 var(--sp2);align-items:start}
#sheet.sss .grid3>*{min-width:0;max-width:100%}
#sheet.sss .inline-in{width:92px;background:#fff;border:1px solid var(--line2s);border-radius:var(--r-md);height:38px;padding:0 var(--sp2);font-size:16px;text-align:right}
#sheet.sss .note{font-size:12px;color:var(--mut)}
#sheet.sss .mt2{margin-top:var(--sp2)}#sheet.sss .mb2{margin-bottom:var(--sp2)}
#sheet.sss .grow{flex:1;min-width:0}
.scanbtn{width:100%;height:50px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.scanbtn svg{width:19px;height:19px}
.invsub{text-align:center;margin:7px 0 10px;font-size:12px;color:var(--mute)}
.cell .pp{font-size:10.5px;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* v1.3.0 §3 写真：POST 統合版の CSS（撮影画面・写真の管理・編集・背景ぼかし）を .pst の中だけに適用。
   色だけはセラーのモノクロに合わせる（POST の青・緑・黄のアクセント → 黒・グレー。黄色バナーは書き出す画像の中だけ） */
.pst{--bg2:#ececea;--line:#e7e7e2;--tx:#141414;--mut:#77776f;--mut2:#9a9a94;--acc:#141414;--pos:#141414;--posbg:#ececea;--neg:#b3261e;--amb:#55554f;--safe:env(safe-area-inset-bottom,0px)}
#shoot{position:fixed;inset:0;z-index:30;background:#fbfbfa;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(40px + env(safe-area-inset-bottom,0px))}
#psheet{position:fixed;inset:0;z-index:35;background:#fbfbfa;display:flex;flex-direction:column}
#psheet .sh{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line);background:#fff}
#psheet .sh h3{font-size:16px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#psheet .sb{flex:1;overflow:auto;padding:12px 16px calc(40px + var(--safe))}
.pst button{cursor:pointer;background:none;border:0;padding:0;min-height:0}
.pst .h-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pst .sub{font-size:12px;color:var(--mut)}
.pst .nw{white-space:nowrap}
.pst .lnk{font-size:12.5px;font-weight:700;color:var(--acc);text-decoration:none;min-height:0;padding:0}
.pst .chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3.5px 8px;border-radius:999px;background:#f0f0ec;color:#55554f;white-space:nowrap;border:0;min-height:0}
.pst .fchip{font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #e3e3de;color:#55554f;white-space:nowrap;flex:none}
.pst .fchip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.pst .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;margin-bottom:0}
.pst .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-weight:700;border:1px solid transparent;min-height:44px;padding:0 14px;font-size:14px;white-space:nowrap;background:#fff;color:var(--tx)}
.pst .btn-pri{background:var(--tx);color:#fff;width:100%;font-size:14.5px}
.pst .btn-acc{background:var(--acc);color:#fff}
.pst .btn-ghost{background:#fff;border-color:#dededa;color:var(--tx)}
.pst .btn-dng{background:#fff;border-color:#e8c2bf;color:var(--neg)}
.pst .btn.sm{min-height:34px;padding:0 10px;font-size:12px;border-radius:10px}
.pst .btn.wide{flex:1;width:auto}
.pst .btn:disabled{opacity:.45}
.pst .btns{display:flex;gap:8px;flex-wrap:wrap}
.pst .back{font-size:13px;color:var(--mut);padding:4px 0}
.pst .dtitle{font-size:17px;font-weight:800;margin-top:8px;overflow-wrap:anywhere}
.pst .photos{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.pst .ph{width:64px;height:64px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-align:center;line-height:1.3;position:relative;overflow:hidden;background:#cfd3d6;cursor:pointer}
.pst .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pst .ph .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);font-size:8.5px;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst .ph.vac{background:#fff;border:1.5px dashed #cfcfc9;color:var(--mut2)}
.pst .ph.vac .tp{margin-top:-12px}
.pst .ph.vac .lbl{background:#f0f0ec;color:#77776f}
.pst .camin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pst .ck{font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 9px;white-space:nowrap;letter-spacing:0;background:#fff}
.pst .ck.on{background:var(--posbg);border-color:#c8c8c8;color:var(--pos)}
.pst .ck:disabled{opacity:.5}
.pst .secttl{font-size:12px;font-weight:800;letter-spacing:.05em;color:#55554f;margin:16px 0 2px;white-space:nowrap}
.pst details.fold{margin-top:12px;background:none;border:0;border-radius:0;margin-bottom:0}
.pst details.fold>summary{list-style:none;cursor:pointer;font-size:12.5px;color:#55554f;font-weight:600;display:flex;justify-content:space-between;white-space:nowrap;padding:0}
.pst details.fold.wrap>summary{white-space:normal;gap:8px}
.pst details.fold>summary::-webkit-details-marker{display:none}
.pst details.fold>summary::after{content:"▸";color:var(--mut);flex:none}.pst details.fold[open]>summary::after{content:"▾"}
.pst .bigframe{display:block;position:relative;margin-top:10px;width:100%;aspect-ratio:4/3;max-height:330px;background:#1b1b1e;border-radius:22px;overflow:hidden;cursor:pointer;color:#fff}
.pst .bigframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pst .bigframe .guide{position:absolute;inset:40px 30px;border:1.5px solid rgba(255,255,255,.75);border-radius:6px}
.pst .bigframe .guide:before,.pst .bigframe .guide:after{content:"";position:absolute;background:rgba(255,255,255,.3)}
.pst .bigframe .guide:before{left:50%;top:0;bottom:0;width:1px}.pst .bigframe .guide:after{top:50%;left:0;right:0;height:1px}
.pst .bigframe .tap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;font-size:15px;letter-spacing:.06em;padding:0 40px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.pst .bigframe .tap small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:6px;letter-spacing:0;line-height:1.5}
.pst .bigframe .ov{position:absolute;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:3.5px 8px;border-radius:999px}
.pst .cuts{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.pst .cut{flex:1 0 50px;text-align:center;font-size:10px;font-weight:700;color:var(--mut);line-height:1.3}
.pst .cut .bx{height:44px;border-radius:10px;background:var(--bg2);border:1px solid #e0e0db;display:flex;align-items:center;justify-content:center;font-size:15px;color:#b9b9b3;margin-bottom:4px}
.pst .cut.done .bx{background:var(--posbg);border-color:#c8c8c8;color:var(--pos)}
.pst .cut.now .bx{background:#fff;border-color:var(--tx);color:var(--tx)}
.pst .cut.now{color:var(--tx)}
.pst .flag{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-top:8px}
.pst .flag>*{min-width:0}
.pst .flag>span{font-size:12px;color:var(--mut);white-space:nowrap}
.pst .seg{display:flex;min-width:0;background:#efefeb;border-radius:12px;padding:3px;border:0;margin-bottom:0;overflow:visible}
.pst .seg button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:12px;font-weight:700;padding:7px 0;border-radius:9px;color:var(--mut);white-space:nowrap;background:none}
.pst .seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pst .flag input.memo1{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;height:38px;padding:0 8px;background:#fff}
.pst .tog{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px}
.pst .tog input{width:20px;height:20px;accent-color:var(--tx);flex:none}
.pst .shotrow{display:grid;grid-template-columns:72px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.pst .shotrow .ph{width:72px;height:72px}
.pst .shotrow .lb{font-weight:700;font-size:13px}
.pst .shotrow .gd{font-size:11px;color:var(--mut);margin:2px 0 6px}
.pst .bdg{display:inline-block;font-size:10px;border-radius:6px;padding:0 6px;border:1px solid var(--line);color:var(--mut);margin-left:4px;font-weight:600}
.pst .bdg.req{color:var(--amb);border-color:#bdbdb6}.pst .bdg.ok{color:var(--pos);border-color:#c8c8c8}.pst .bdg.cover{background:var(--acc);border-color:var(--acc);color:#fff}
.pst .model{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-bottom:6px;cursor:pointer}
.pst .model img{width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.pst .selbox{width:22px;height:22px;flex:none;align-self:center;accent-color:var(--tx)}
.pst .srch{display:flex;gap:8px;margin-top:12px}
.pst .srch input{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;height:42px;padding:0 12px}
.pst .imgpv{position:relative;display:block;margin:0 auto 10px;max-width:100%;width:fit-content}
.pst .imgpv img{display:block;max-width:100%;max-height:50vh;border-radius:8px}
.pst .imgpv svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pst .cropbox{position:relative;width:min(320px,100%);aspect-ratio:1/1;margin:0 auto;overflow:hidden;border-radius:8px;background:#000;touch-action:none;outline:2px solid #fff}
.pst .cropbox img{position:absolute;max-width:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.pst .cropbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pst .cropbox svg line{stroke:#fff;stroke-opacity:.7;stroke-width:1}.pst .cropbox svg line.c{stroke:#fff;stroke-opacity:.9;stroke-dasharray:6}
.pst .cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pst .cmp img{width:100%;border-radius:8px}
.pst .mk{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.6);pointer-events:none}
.pst .blst{margin:0 0 8px;font-size:12px;color:var(--acc)}
.pst .blst .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pst .blst .bar i{display:block;height:100%;width:40%;background:var(--acc);animation:blbar 1.1s linear infinite}
@keyframes blbar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.pst .gdbox{background:#f2f2f0;border:1px solid #d6d6d2;color:#141414;border-radius:12px;padding:8px 10px;font-size:12.5px;margin-bottom:8px}
.pst .fld{margin-bottom:12px}.pst .fld textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:8px}
</style>
</head>
<body>
<header><h1 id="title">セラー</h1></header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="analysis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16"/><path d="M7.5 15l4-4.5 3 3 5-6"/></svg>分析</button>
  <button data-tab="sales"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>売上管理表</button>
  <button data-tab="master"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>在庫</button>
  <button data-tab="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V5h6v2.5M3.5 12.5h17"/></svg>ツール</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>設定</button>

<div id="modal" hidden></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<div id="shoot" class="pst" hidden></div>
<div id="psheet" class="pst" hidden><div class="sh"><h3 id="shT"></h3><button class="btn btn-ghost sm" data-act="closeSheet">閉じる</button></div><div class="sb" id="shB"></div></div>
<script>
"use strict";
const APP_VER = "1.5.0";
const $ = s => document.querySelector(s);
const DB_NAME = "seller_app";
const ST_LABEL = {stock:"仕入れ済み", listed:"出品中", deal:"取引中", sold:"売却済み", cand:"候補"};
const ST_ORDER = ["stock","listed","deal","sold","cand"];
const CH_KEYS = ["m","y","r","a"];
const DEFAULT_SETTINGS = {ch:{m:{name:"メルカリ",fee:10,ship:160},y:{name:"Yahoo!フリマ",fee:5,ship:160},r:{name:"ラクマ",fee:10,ship:150},a:{name:"ヤフオク",fee:10,ship:160}},pack:30,target:30};
const COND_CHIPS = ["帯あり","初版","特典つき","やや傷あり","傷あり","日焼け","良好"];
const SHIP_METHODS = ["ゆうパケット","ゆうパケットポスト","ゆうパケットプラス","ネコポス","宅急便コンパクト","宅急便","ゆうパック","定形外郵便","クリックポスト","レターパック","その他"];
const KINDS = {sale:"売上", buy:"仕入のみ"};

/* ---------- IndexedDB（meta=状態1件 / imgs=写真） ---------- */
let _db = null;
function openDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
      if (!db.objectStoreNames.contains("imgs")) db.createObjectStore("imgs");
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function idb(store, mode, fn){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    let val;
    if (req) req.onsuccess = () => { val = req.result; };
    tx.oncomplete = () => res(val);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}
const idbGet = (s, k) => idb(s, "readonly", o => o.get(k));
const idbPut = (s, k, v) => idb(s, "readwrite", o => o.put(v, k));
const idbDel = (s, k) => idb(s, "readwrite", o => o.delete(k));
const idbKeys = (s) => idb(s, "readonly", o => o.getAllKeys());

/* ---------- 状態 ---------- */
let S = emptyState();
function emptyState(){
  return {schema:2, items:[], biblio:{}, settings:cleanSettings(null), templates:[], expenses:[], queue:[], meta:{}};
}
function saveState(){ return idbPut("meta", "state", S); }
async function loadState(){
  const v = await idbGet("meta", "state");
  if (v && Array.isArray(v.items)) S = Object.assign(emptyState(), v, {settings: cleanSettings(v.settings)});
}
/* v1.1.0 端末内だけの状態（バックアップには含めない）: 定型文のピン留め・計算の初期値・ぼかし強さ */
const LOCAL_DEF = {pins:[], calc:{ship:210, fee:10, rate:30}, blur:"m"};
let LOC = cleanLocal(null);
function cleanLocal(v){
  const s = isPlainObj(v) ? v : {}, c = isPlainObj(s.calc) ? s.calc : {};
  const n = (x, d) => x !== undefined && x !== "" && Number.isFinite(Number(x)) ? Number(x) : d;
  return {pins: Array.isArray(s.pins) ? s.pins.filter(x => typeof x === "string") : [],
    calc: {ship: n(c.ship, LOCAL_DEF.calc.ship), fee: n(c.fee, LOCAL_DEF.calc.fee), rate: n(c.rate, LOCAL_DEF.calc.rate)},
    blur: ["none","w","m","s"].includes(s.blur) ? s.blur : LOCAL_DEF.blur,
    // v1.3.0 §3 POST の S.settings.autoBlur（撮影後に背景ぼかし）と S.models（お手本）に当たる端末内の設定
    autoBlur: s.autoBlur === true,
    models: isPlainObj(s.models) ? Object.fromEntries(Object.entries(s.models).filter(([k, v]) => typeof k === "string" && typeof v === "string")) : {}};
}
function saveLocal(){ return idbPut("meta", "local", LOC); }
async function loadLocal(){ LOC = cleanLocal(await idbGet("meta", "local")); }

/* ---------- 共通 ---------- */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){
  if (v === null || v === undefined || v === "") return 0;
  const x = Number(String(v).replace(/[,，円¥￥\s]/g, ""));
  return Number.isFinite(x) ? x : 0;
}
function yen(v){ return (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString("ja-JP"); }
function pct(v){ return v === null ? "—" : v.toFixed(1) + "%"; }
function isPlainObj(o){ return o && typeof o === "object" && !Array.isArray(o); }
function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function normDate(d){
  const m = String(d ?? "").match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  return m ? m[1] + "-" + m[2].padStart(2,"0") + "-" + m[3].padStart(2,"0") : "";
}
function monthKey(d){ const n = normDate(d); return n ? n.slice(0,7) : ""; }
function addMonth(mk, k){ let [y, m] = mk.split("-").map(Number); m += k; while (m < 1){ m += 12; y--; } while (m > 12){ m -= 12; y++; } return y + "-" + String(m).padStart(2,"0"); }
function mLabel(mk){ const [y, m] = mk.split("-"); return y + "年" + Number(m) + "月"; }
function newId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function chName(k){ const c = S.settings.ch[k]; return c ? c.name : (k ? String(k) : "—"); }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

function cleanSettings(src){
  const s = isPlainObj(src) ? src : {};
  const out = {ch:{}, pack:DEFAULT_SETTINGS.pack, target:DEFAULT_SETTINGS.target};
  // 既知キー以外もデータとしては保持（落とさない）。ただし __proto__ 等は除外
  for (const k of Object.keys(s)) if (k !== "ch" && k !== "__proto__" && k !== "constructor" && k !== "prototype") out[k] = s[k];
  const sc = isPlainObj(s.ch) ? s.ch : {};
  for (const k of CH_KEYS){
    const d = DEFAULT_SETTINGS.ch[k], c = isPlainObj(sc[k]) ? sc[k] : {};
    out.ch[k] = {
      name: typeof c.name === "string" && c.name ? c.name : d.name,
      fee: c.fee !== undefined && c.fee !== "" ? num(c.fee) : d.fee,
      ship: c.ship !== undefined && c.ship !== "" ? num(c.ship) : d.ship
    };
  }
  out.pack = s.pack !== undefined && s.pack !== "" ? num(s.pack) : DEFAULT_SETTINGS.pack;
  out.target = s.target !== undefined && s.target !== "" ? num(s.target) : DEFAULT_SETTINGS.target;
  return out;
}

/* ---------- 計算（§3） ---------- */
function feeRateOf(it, set){
  if (it.feeRate !== undefined && it.feeRate !== null && it.feeRate !== "") return num(it.feeRate);
  const c = (set || S.settings).ch[it.soldCh];
  return c ? num(c.fee) : 0;
}
function feeOf(price, rate){ return Math.floor((price * rate + 1e-7) / 100); }
function calc(it, set){
  const price = num(it.soldPrice), rate = feeRateOf(it, set), fee = feeOf(price, rate);
  const cost = num(it.cost), ship = num(it.ship), pack = num(it.pack), other = num(it.other);
  const profit = price - cost - ship - pack - fee - other;
  const margin = price ? Math.round(profit / price * 1000) / 10 : null;
  return {price, rate, fee, cost, ship, pack, other, profit, margin, costTotal: cost + ship + pack + fee + other};
}
/* v1.2.0 §4 束ね（SSS と同じ表現）：メンバー単巻は inSet＝親の id。親は setk:"セット"・autoBundle:1（まとめ売りは mixed:1）。
   メンバーは一覧から隠し、集計からも外す（親の金額だけを数える）。親が存在しない inSet（孤児）は隠さない */
function memberSet(){
  const ids = new Set(S.items.map(i => String(i.id))), out = new Set();
  for (const it of S.items) if (it.inSet !== undefined && it.inSet !== null && it.inSet !== "" && String(it.inSet) !== String(it.id) && ids.has(String(it.inSet))) out.add(it);
  return out;
}
function membersOf(id){ return S.items.filter(m => m.inSet !== undefined && m.inSet !== null && String(m.inSet) === String(id) && String(m.id) !== String(id)); }
// 在庫（SSS の集計と同じ：仕入れ済み・出品中・取引中で、束ねられたメンバーを除く）
function invAgg(){
  const mem = memberSet(); const a = {n:0, cost:0, by:{stock:0, listed:0, deal:0}};
  for (const it of S.items) if ((it.st === "stock" || it.st === "listed" || it.st === "deal") && !mem.has(it)){ a.n++; a.cost += num(it.cost); a.by[it.st]++; }

function parseBackup(json){

  if (!Array.isArray(d.items)) throw new Error("items が見つかりません");
  const items = [];

  for (const raw of d.items){
    if (!isPlainObj(raw)) continue;
    const it = JSON.parse(JSON.stringify(raw));
    if (it.id === undefined || it.id === null || it.id === "") it.id = newId();
    it.id = String(it.id);
    while (seen.has(it.id)) it.id = it.id + "_" + Math.random().toString(36).slice(2, 5);
    seen.add(it.id);
    if (typeof it.thumb !== "string") it.thumb = "";

    if (!Array.isArray(it.condChips)) it.condChips = [];

    items.push(it);

}

// POST の guessFlags（タイトルから区分・初版・帯・特典を推定）。POST の work/sub/商品名欄 → セラーの商品名
function guessFlags(it){ const t = [itemTitle(it)].join(" ").normalize("NFKC");
  const o = {setk: mapSetk(/全巻|全\d+巻/.test(t) ? "全巻" : /\d+\s*[-〜~]\s*\d+\s*巻|セット/.test(t) ? "途中" : "単品"), shoban:"none", obi:"none", bonus:false, condBad:false};
  if (/一部初版|初版一部|初版あり/.test(t)) o.shoban = "part"; else if (/初版/.test(t)) o.shoban = "all";
  if (/帯なし/.test(t)) o.obi = "none"; else if (/一部帯|帯一部|帯あり/.test(t)) o.obi = "part"; else if (/帯/.test(t)) o.obi = "all";
  if (/特典|付録|クリアファイル|ポストカード/.test(t)) o.bonus = true; return o; }
const itemTitle = p => { const it = p && p._it; return (it ? String(it.name || "").trim() : "") || "（無題）"; };
// 撮影データ ph の正規化（POST の sanitizeItem / fixItem の撮影部分）。バックアップ由来の値もここで型を絞る
function phFix(it){
  const sn = (v, m = 200) => v == null ? "" : String(v).slice(0, m);
  let p = isPlainObj(it.ph) ? it.ph : null;
  if (!p){
    p = {}; const tmp = {_it: it}; const g = guessFlags(tmp); Object.assign(p, g);
    p.shots = canon(p).map(k => mkShot(k, true));
    // v1.2.0 以前に付けた写真は、撮影リストの先頭に「以前の写真」枠として残す（先頭＝これまでのメイン画像のまま）
    const old = itemPhotos(it);
    p.shots.unshift(...old.map((id, i) => ({key:"old_" + i, label:`以前の写真 ${i + 1}`, required:false, imgId:id, cover:false, custom:true, legacy:true, edit:{}, base:{}})));

  }

  if (!p.shots.length) p.shots = canon(p).map(k => mkShot(k, true));

// v1.3.0 §1 色で見分ける（グラフだけの例外。線はすべて実線）[キー, 色, 太さ, 名前]
// 3色は色覚の型を問わず区別できる組み合わせ（検証ツールで全組の色差 ΔE≥9 を確認）。文字は色を使わず黒・グレーのまま
const CHART_KEYS = [["sales","#2a78d6",2,"売上"],["cost","#eb6834",2,"コスト"],["profit","#1baf7a",2.5,"純利益"]];
function chartSVG(months, series){
  const W = 340, H = 190, L = 44, R = 10, T = 10, B = 26;
  const keys = CHART_KEYS;
  let max = 0, min = 0;
  for (const s of series) for (const [k] of keys){ max = Math.max(max, s[k]); min = Math.min(min, s[k]); }
  if (max === min) max = min + 1000;
  const step = niceStep((max - min) / 4);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const x = i => L + (W - L - R) * (months.length === 1 ? 0.5 : i / (months.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  let g = "";
  for (let v = min; v <= max + 1e-6; v += step){
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "#b5b5b5" : "#ebebeb"}" stroke-width="1"/>`;
    g += `<text x="${L - 4}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="#8a8a8a">${shortYen(v)}</text>`;
  }
  months.forEach((m, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#4d4d4d">${Number(m.slice(5))}月</text>`; });
  for (const [k, col, sw] of keys){
    const pts = series.map((s, i) => x(i).toFixed(1) + "," + y(s[k]).toFixed(1)).join(" ");
    g += `<polyline data-k="${k}" points="${pts}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
    series.forEach((s, i) => { g += `<circle data-k="${k}" cx="${x(i)}" cy="${y(s[k])}" r="4" fill="${col}" stroke="#fff" stroke-width="2"/>`; });
  }
  months.forEach((m, i) => {
    const w = (W - L - R) / Math.max(1, months.length - 1);
    g += `<rect data-act="tip" data-i="${i}" x="${x(i) - w / 2}" y="0" width="${w}" height="${H}" fill="transparent"/>`;
  });
  chartSVG.last = {months, series};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="売上・コスト・純利益の月別推移">${g}</svg>`;
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1)))); for (const k of [1, 2, 2.5, 5, 10]) if (raw <= k * p) return k * p; return 10 * p; }
function shortYen(v){ return Math.abs(v) >= 10000 ? (v / 10000).toFixed(Math.abs(v) % 10000 ? 1 : 0) + "万" : String(v); }

// SSS workKey（作品名の正規化）をそのまま移植
function workKey(s){

  t = t.replace(/全巻|完結|セット|初版|帯付き?|チラシ付き?|特典付き?|美品|中古|コミックス?|漫画|まとめ売り?|送料無料|即購入可/g, " ");
  t = t.replace(/[\s・:：!！?？、。,.\-_~〜～\/／|｜+＋'"]+/g, "");
  t = t.replace(/\d+$/, "");

}
const itemKey = it => workKey(it.work || it.name);
function parseVols(s){ const set = new Set(); String(s || "").normalize("NFKC").split(/[,、\s]+/).forEach(p => {
  const m = p.match(/^(\d+)(?:[-~〜](\d+))?$/); if (!m) return; const a = +m[1], b = m[2] ? +m[2] : a; if (Math.abs(b - a) > 500) return;
  for (let i = Math.min(a, b); i <= Math.max(a, b); i++) set.add(i); }); return set; }
function volOf(name){ const t = String(name || "").normalize("NFKC");
  const m = t.match(/巻[ノの]\s*(\d{1,3})/) || t.match(/第?\s*(\d+)\s*巻/) || t.match(/vol\.?\s*(\d+)/i) || t.match(/\s(\d{1,3})\s*$/) || t.match(/[\s―—](\d{1,3})(?=[\s―—]|$)/); return m ? +m[1] : null; }

// まとめ売りの商品名：メンバー名の最長共通接頭辞（末尾の空白・記号は除く）＋「まとめ売り」。接頭辞が2文字未満なら「先頭の名前 他まとめ売り」
function mixedName(ms){ const ns = ms.map(m => String(m.name || "")); let pre = ns[0] || "";
  for (const n of ns.slice(1)){ let i = 0; while (i < pre.length && i < n.length && pre[i] === n[i]) i++; pre = pre.slice(0, i); }
  pre = pre.replace(/[\s・:：\/／\-―—(（　]+$/, "").trim();
  return [...pre].length >= 2 ? `${pre} まとめ売り` : `${ns[0]} 他まとめ売り`; }
function setName(ms, lo, hi){ const base = ((ms[0].work) || ms[0].name || "").replace(/第?\s*\d+\s*巻.*$/, "").trim(); return `${base} ${lo}〜${hi}巻 セット`; }
function selItems(){ return Object.keys(UI.sel).map(id => S.items.find(x => String(x.id) === id)).filter(Boolean); }

  const cost = ms.reduce((s, m) => s + (num(m.cost) || 0), 0);

    target = newBundleItem({name, work:"", setk:"セット", range:"", have:"", st: allStock ? "stock" : "cand", cost: allStock ? cost : "", genre: ms[0].genre || "", pub: ms[0].pub || "", cat: ms[0].cat || "",
      listPrice: lp > 0 ? lp : "", autoBundle:1, mixed:1, memo: "一覧で束ね（まとめ売り）：" + ms.map(m => m.name).join("、")});

    target = newBundleItem({name: setName(ms, lo, hi), work: ms[0].work || "", setk:"セット", range: `${lo}-${hi}`, have: [...have].sort((a, b) => a - b).join(","), st: allStock ? "stock" : "cand", cost: allStock ? cost : "",

/* ---------- v1.3.0 §2 読み取りで登録：SSS 台帳版の regOpen / regParams / regDup / regAdd / regPendShow / regCode と

   セラー側で変えたのは：保存先（セラーの items）、入口の置き場所（在庫タブ）、書誌引き（下記）、色（モノクロ）、絵文字を外したこと。
   書誌引き：SSS の fetchBiblio は取り込み済み biblio に無いと openBD に問い合わせるが、セラーは外部通信をしない方針のため biblio だけを引く ---------- */
const BOOK = "本・コミック";
const catOf = x => String((x && x.cat) || "").trim() || BOOK; const isBook = x => catOf(x) === BOOK;

function sssNum(v){ if (v === null || v === undefined || v === "") return NaN; if (typeof v === "number") return v;

const yenT = n => isFinite(n) ? Math.round(n).toLocaleString("ja-JP") + "円" : "—";
/* 書誌（SSS fetchBiblio の代わり：取り込み済み biblio のキーを ISBN-10/13 の両方で引く。通信しない） */
function normIsbn(s){ return String(s ?? "").replace(/[^0-9Xx]/g, "").toUpperCase(); }

}
async function fetchBiblio(isbn){
  const b = lookupBiblio(isbn); if (!b) return {none:true};
  const o = biblioToItem(b, isbn); if (!o.name) return {none:true};
  return {title:o.name, author:o.author, pub:o.pub, cover:o.cover};
}

const LP = [[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];

function matchDigit(R, o, left){

  const test = (p, d, g) => { let e = 0; for (let k = 0; k < 4; k++) e += Math.abs(v[k] - p[k]); if (e < be){ be = e; best = {d, g}; } };
  LP.forEach((p, d) => test(p, d, false)); if (left) GP.forEach((p, d) => test(p, d, true));
  return be < 1.5 ? best : null;

function tryEAN(R, s){

  if (s > 0 && R[s - 1] < m * 2.5) return null;

async function importPhoto(it, i, file){ const s = it.shots[i]; if (!s) return; toast("保存中…");

  else { PUI.cut = i; PUI.view = "shoot"; PUI.from = ED ? "editor" : "grid"; }

/* ---------- v1.5.0 Googleドライブ同期（GIS トークンフロー・drive.file のみ） ----------
   - ログインは Google Identity Services の initTokenClient。アクセストークンはメモリ（DRIVE.token）だけに持ち、保存しない
   - シークレットは使わない（ブラウザだけで完結するトークンフロー）
   - 同期状態は IndexedDB meta の driveFileId／driveBaseline（前回同期成功時の data）／driveLastSyncAt
   - 写真（imgs）には触らない */
const GSI_SRC = "https://accounts.google.com/gsi/client";
const GSI_CLIENT_ID = "238178207914-4ippnllcf4pj8n7thd35761pf5o8n1qe.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";

/* 内容比較用：キー順に依らない JSON 文字列 */
function jcanon(v){
  if (Array.isArray(v)) return "[" + v.map(x => x === undefined ? "null" : jcanon(x)).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + jcanon(v[k])).join(",") + "}";
  return v === undefined ? "null" : JSON.stringify(v);
}
/* マージ（純粋関数）。local/remote/baseline は書き出し形式の data（items 配列＋その他のキー）。
   baseline が無いときは空として扱う。remote が無い（初回）ときは local そのまま。
   戻り値 {data, conflicts（items の両側変更）, docConflicts（items 以外の両側変更）, toLocal, toRemote（items の件数）} */
function mergeDriveData(local, remote, baseline){
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const L = isPlainObj(local) ? local : {}, B = isPlainObj(baseline) ? baseline : {};
  const byId = d => { const m = new Map(); for (const it of (isPlainObj(d) && Array.isArray(d.items) ? d.items : [])) if (isPlainObj(it) && it.id !== undefined && it.id !== null && it.id !== "") m.set(String(it.id), it); return m; };
  if (!isPlainObj(remote)) { const data = clone(L); return {data, conflicts:0, docConflicts:0, toLocal:0, toRemote:byId(data).size}; }
  const R = remote, lm = byId(L), rm = byId(R), bm = byId(B);
  const eq = (a, b) => jcanon(a) === jcanon(b);
  let conflicts = 0, docConflicts = 0;
  const out = [];
  const order = [...lm.keys(), ...[...rm.keys()].filter(k => !lm.has(k))];
  for (const id of order){
    const l = lm.get(id), r = rm.get(id), b = bm.get(id), inB = bm.has(id);
    if (l && r){
      if (eq(l, r)) { out.push(l); continue; }
      const lc = !inB || !eq(l, b), rc = !inB || !eq(r, b);
      if (lc && rc) { conflicts++; out.push(l); } else out.push(rc ? r : l);
    } else if (l){
      if (inB && eq(l, b)) continue;   // 相手側で削除・こちらは無変更 → 削除
      out.push(l);
    } else {
      if (inB && eq(r, b)) continue;   // こちらで削除・相手側は無変更 → 削除
      out.push(r);
    }
  }
  const data = {};
  const keys = new Set([...Object.keys(L), ...Object.keys(R)]); keys.delete("items");
  for (const k of keys){
    const l = L[k], r = R[k], b = B[k];
    let v;
    if (eq(l, r)) v = l;
    else { const lc = !eq(l, b), rc = !eq(r, b); if (lc && rc) { docConflicts++; v = l; } else v = rc ? r : l; }
    if (v !== undefined) data[k] = clone(v);
  }
  data.items = clone(out);
  const mm = byId(data);
  const diff = (a, b) => { let n = 0; for (const [k, v] of a) if (!b.has(k) || !eq(v, b.get(k))) n++; for (const k of b.keys()) if (!a.has(k)) n++; return n; };
  return {data, conflicts, docConflicts, toLocal:diff(mm, lm), toRemote:diff(mm, rm)};
}

function gsiLoad(){

  if (r.status === 401){ DRIVE.token = null; DRIVE.exp = 0; throw new DriveErr("ログインの有効期限が切れました。もう一度押してください", 401); }
  if (!r.ok) throw new DriveErr("ドライブの応答エラー（" + r.status + "）", r.status);
  return r;
}
async function driveFindFile(fileId){
  if (fileId){
    try {
      const r = await driveFetch(DRIVE_API + "/" + encodeURIComponent(fileId) + "?fields=id,trashed");
      const j = await r.json();
      if (j && j.id && !j.trashed) return j.id;
    } catch (e) { if (e.status !== 404) throw e; }
  }
  const q = "name = '" + DRIVE_FILE + "' and trashed = false and 'root' in parents";
  const r = await driveFetch(DRIVE_API + "?spaces=drive&orderBy=modifiedTime%20desc&pageSize=10&fields=files(id)&q=" + encodeURIComponent(q));
  const j = await r.json();
  return j && Array.isArray(j.files) && j.files[0] && j.files[0].id ? j.files[0].id : null;
}
function driveBody(data){

}
async function driveUpdate(id, data){

}
/* 同期本体。失敗したときは端末データ・baseline とも変更しない */
async function driveSync(){
  if (DRIVE.busy) return null;
  DRIVE.busy = true; DRIVE.msg = ""; driveMsg("同期中…");
  const snap = jcanon(driveNorm(buildExport().data));
  try {
    const local = driveNorm(buildExport().data);
    const savedId = await idbGet("meta", "driveFileId");
    const baseline = await idbGet("meta", "driveBaseline");
    let id = await driveFindFile(savedId), remote = null, created = false;
    if (id){
      const r = await driveFetch(DRIVE_API + "/" + encodeURIComponent(id) + "?alt=media");
      let root; try { root = JSON.parse(await r.text()); } catch (e) { throw new DriveErr("ドライブのファイルを読めませんでした", 0); }
      if (!isPlainObj(root) || !isPlainObj(root.data) || !Array.isArray(root.data.items)) throw new DriveErr("ドライブのファイルの形式が違います", 0);
      remote = driveNorm(root.data);
    }
    // 前回の同期記録が無い端末は「初期状態」を基準にする（新しい端末の空の設定で相手側を上書きしないため）
    const m = mergeDriveData(local, remote, isPlainObj(baseline) ? baseline : driveDefaultData());
    const merged = driveNorm(m.data), mc = jcanon(merged);
    if (jcanon(driveNorm(buildExport().data)) !== snap) throw new DriveErr("同期中にデータが変更されました。もう一度押してください", 0);
    if (!id){ id = await driveCreate(merged); created = true; }
    else if (mc !== jcanon(remote)) await driveUpdate(id, merged);
    if (mc !== snap){
      if (jcanon(driveNorm(buildExport().data)) !== snap) throw new DriveErr("同期中にデータが変更されました。もう一度押してください", 0);
      await driveApply(merged);
    }
    const at = new Date().toISOString();
    await idbPut("meta", "driveFileId", id);
    await idbPut("meta", "driveBaseline", merged);
    await idbPut("meta", "driveLastSyncAt", at);
    DRIVE.last = at;
    const res = {created, toLocal:m.toLocal, toRemote:remote ? m.toRemote : merged.items.length, conflicts:m.conflicts, docConflicts:m.docConflicts};
    const msg = (created ? "ドライブに同期用ファイルを作成しました。同期しました" : "同期しました") +
      "（取り込み " + res.toLocal + "件・送信 " + res.toRemote + "件・競合 " + res.conflicts + "件" + (res.docConflicts ? "・設定等の競合 " + res.docConflicts + "件" : "") + "）";
    DRIVE.busy = false; DRIVE.msg = "";
    if (mc !== snap) render();
    driveMsg(msg + "／最終同期 " + driveFmt(at)); toast(created ? "ドライブに同期用ファイルを作成しました" : "同期しました");
    return res;
  } catch (e) {
    DRIVE.busy = false;
    driveMsg("同期できませんでした：" + (e instanceof DriveErr ? e.message : "処理中にエラーが発生しました"));
    return null;
  }
}
/* 端末への適用：台帳データ（items・定型文・設定など）だけ置き換える。写真 imgs には触らない */

/* ---------- §3 計算（POST 統合版の calcRun / perVolTxt / capTxt / needCalc と同じ式） ---------- */
let C = null;
function calcNew(keep){
  const d = LOC.calc;
  return Object.assign({lp:"", lv:"", lr:String(d.rate), rc:"", rs:String(d.ship), rf:String(d.fee), rr:""}, keep || {}, {sale:"", cost:"", ship:String(d.ship), fee:String(d.fee), res:null});
}
function calcReset(){ C = calcNew(C ? {lp:C.lp, lv:C.lv, lr:C.lr, rc:C.rc, rs:C.rs, rf:C.rf, rr:C.rr} : null); }
// 入力欄の数値化。空欄は NaN（POST と同じく「未入力」を区別する）
function cnum(v){
  if (v === null || v === undefined || v === "") return NaN; if (typeof v === "number") return v;
  const t = String(v).normalize("NFKC").replace(/[,¥￥円%％\s]/g, ""); if (t === "") return NaN;
  const n = Number(t); return Number.isFinite(n) ? n : NaN;
}
// 利益計算：手数料＝round(販売価格×手数料%÷100)、利益＝販売価格−原価−配送料−手数料、利益率＝利益÷販売価格（POST calcRun と同じ）
function calcProfit(c){
  const sale = cnum(c.sale), cost = cnum(c.cost) || 0, ship = cnum(c.ship) || 0, fp = cnum(c.fee);
  if (!(sale > 0)) return {err:"販売価格を入力してください"};
  if (!Number.isFinite(fp)) return {err:"手数料（%）を入力してください"};
  const fee = Math.round(sale * fp / 100), profit = sale - cost - ship - fee;
  return {profit, rate: profit / sale * 100, fee};
}
function calcRun(){
  for (const e of document.querySelectorAll("[data-c]")) C[e.dataset.c] = e.value;
  const r = calcProfit(C);
  if (r.err){ toast(r.err); return; }
  C.res = r; calcPaint();
}
function calcPaint(){
  const r = C.res, p = document.getElementById("rP"), q = document.getElementById("rR"), f = document.getElementById("rF");
  if (p) p.textContent = r ? yen(r.profit) : "—";
  if (q) q.textContent = r ? r.rate.toFixed(1) + "%" : "—";
  if (f) f.textContent = r ? `販売手数料 ${yen(r.fee)} を差し引いています。梱包費は配送料に含めて入力してください。` : "梱包費は配送料に含めて入力してください。";
}
// 1冊あたりの定価＝round(定価÷巻数)
function perVol(c){ const lp = cnum(c.lp), lv = cnum(c.lv); if (!Number.isFinite(lp) || !Number.isFinite(lv) || lv <= 0) return null; return Math.round(lp / lv); }
// 上限の目安＝floor(定価×掛け率÷(巻数×100))（途中で丸めず最後に切り捨て）
function capOf(c){ const lp = cnum(c.lp), lv = cnum(c.lv), lr = cnum(c.lr); if (!(lp > 0) || !(lv > 0) || !(lr > 0)) return null; return Math.floor(lp * lr / (lv * 100)); }
// 出品価格の逆算：POST は ceil((原価＋配送料)×100÷(100−手数料%−目標利益率%)) の1円単位。
// セラーは §0（逆算は10円単位で切り上げ）に合わせ、POST と同じ必要額を10円単位に切り上げる。利益は §0 の手数料 floor で出す
function needCalc(c){
  const cc = cnum(c.rc), s = cnum(c.rs), f = cnum(c.rf), r = cnum(c.rr);
  if (![cc, s, f, r].every(Number.isFinite) || cc < 0 || s < 0 || f < 0) return null;
  const den = 100 - f - r; if (!(den > 0)) return null;
  const raw = (cc + s) * 100 / den;
  const need1 = Math.ceil(raw - 1e-9), need = Math.ceil(raw / 10 - 1e-9) * 10;
  const profit = need - feeOf(need, f) - cc - s;
  return {need1, need, profit, margin: need ? Math.round(profit / need * 1000) / 10 : null};
}
function calcLive(){
  const u = document.getElementById("rU"), cp = document.getElementById("rCap"), n = needCalc(C);
  if (u){ const v = perVol(C); u.textContent = v === null ? "—" : yen(v); }
  if (cp){ const v = capOf(C); cp.textContent = v === null ? "—" : yen(v); }
  const a = document.getElementById("rNeed"), b = document.getElementById("rNeedP"), g = document.getElementById("rNeed1");
  if (a) a.textContent = n ? yen(n.need) : "—";
  if (b) b.textContent = n ? yen(n.profit) + "（" + pct(n.margin) + "）" : "—";
  if (g) g.textContent = n ? yen(n.need1) : "—";
}
function calcHTML(){
  if (!C) C = calcNew();
  const row = (k, l, u, mode) => `<label class="cr"><span class="lb">${l}</span><input data-c="${k}" inputmode="${mode || "numeric"}" value="${esc(C[k])}" placeholder="0" enterkeyhint="done"><span class="u">${u}</span></label>`;
  const srow = (k, l, u, mode) => `<label class="cr"><span class="lb">${l}</span><input data-cset="${k}" inputmode="${mode || "numeric"}" value="${esc(LOC.calc[k])}" enterkeyhint="done"><span class="u">${u}</span></label>`;
  const val = (id, l, big) => `<div class="cr"><span class="lb">${l}</span><span class="val${big ? " big" : ""}" id="${id}">—</span></div>`;
  const html = `<div id="calcv">

    ${row("sale","販売価格","円")}${row("cost","原価","円")}${row("ship","配送料","円")}${row("fee","手数料","%","decimal")}
    <div class="cbtns"><button class="btn pri" data-act="calcRun">計算する</button><button class="btn" data-act="calcClear">クリア</button></div>
    <div style="margin-top:8px">${val("rP","利益",true)}${val("rR","利益率")}</div>
    <div class="cnote" id="rF">梱包費は配送料に含めて入力してください。</div></div>
  <div class="card" id="cPer"><h2>1冊あたりの定価</h2>
    ${row("lp","定価（全巻合計）","円")}${row("lv","巻数","冊")}${row("lr","掛け率","%","decimal")}
    ${val("rU","1冊あたり",true)}${val("rCap","上限の目安",true)}
    <div class="cnote">1冊あたり＝定価÷巻数（四捨五入）。上限の目安＝1冊あたりの定価×掛け率（最後に切り捨て）。</div></div>
  <details class="fold" id="cRev" ${UI.revOpen ? "open" : ""} data-fold="revOpen"><summary>出品価格の逆算（目標利益率から）</summary><div class="in">
    ${row("rc","原価","円")}${row("rs","配送料","円")}${row("rf","手数料","%","decimal")}${row("rr","目標利益率","%","decimal")}
    ${val("rNeed","必要出品価格（10円切り上げ）",true)}${val("rNeedP","その価格での利益")}${val("rNeed1","参考：1円単位の必要額")}
    <div class="cnote">必要出品価格＝(原価＋配送料)÷(1−手数料%−目標利益率%) を10円単位で切り上げ。利益の手数料は切り捨てで計算します。</div></div></details>
  <details class="fold" id="cSet" ${UI.setOpen ? "open" : ""} data-fold="setOpen"><summary>設定（計算の初期値）</summary><div class="in">
    ${srow("ship","配送料の初期値","円")}${srow("fee","手数料率の初期値","%","decimal")}${srow("rate","掛け率の初期値","%","decimal")}
    <div class="cnote">「クリア」を押したときや、次にアプリを開いたときの初期値になります（この端末だけに保存）。</div></div></details>
  </div>`;
  return html;
}
async function calcSetSave(k, v){
  const x = cnum(v); if (!Number.isFinite(x) || x < 0) return;
  LOC.calc[k] = x; await saveLocal();
}
let RESTORE = null;
async function restoreFromText(text){
  let next;
  try { next = parseBackup(JSON.parse(text)); }
  catch (e) { showModal(`<h3>読み込めません</h3><p>${esc(e.message)}</p><div class="acts"><button class="btn" data-act="mclose">閉じる</button></div>`); return; }
  RESTORE = next;
  showModal(`<h3>復元の確認（1/2）</h3>
    <p>次の内容で読み込みます。</p>
    <ul style="padding-left:18px;margin:6px 0"><li>商品 <b id="rsN">${next.items.length}</b>件（${esc(stSummary(next.items))}）</li><li>書誌 ${Object.keys(next.biblio).length}件</li><li>定型文 ${next.templates.length}件</li></ul>
    <div class="acts"><button class="btn" data-act="rsCancel">やめる</button><button class="btn pri" data-act="rsStep2">次へ</button></div>`);
}
function restoreStep2(){
  showModal(`<h3>復元の確認（2/2）</h3>
    <p><b class="neg">現在のデータ ${S.items.length}件はすべて置き換わります。</b>元に戻すには、事前に書き出したバックアップが必要です。</p>
    <div class="acts"><button class="btn" data-act="rsCancel">やめる</button><button class="btn dan" data-act="rsGo">全置換を実行</button></div>`);
}
async function restoreGo(){
  if (!RESTORE) return;
  const next = RESTORE; RESTORE = null;
  await applyRestore(next);
  closeModal(); render(); toast("復元しました（" + S.items.length + "件）");
}

/* モーダル */
function showModal(html){ const m = document.getElementById("modal"); m.innerHTML = `<div class="box">${html}</div>`; m.hidden = false; }
function closeModal(){ const m = document.getElementById("modal"); m.hidden = true; m.innerHTML = ""; }

/* ---------- イベント ---------- */
document.addEventListener("click", async (e) => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn){ setTab(tabBtn.dataset.tab); return; }
  if (e.target.id === "fab"){ openNew(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  // v1.3.0 §3 写真の画面（.pst の中）は POST の操作表 PA へ（POST と同じく disabled と入力欄のクリックは無視）
  if (el.closest(".pst") && PA[el.dataset.act]){ if (el.disabled) return; if (e.target.tagName === "INPUT") return; e.preventDefault(); PA[el.dataset.act](el, e); return; }
  const a = el.dataset.act;
  switch (a){
    case "mprev": UI.month = addMonth(UI.month, -1); render(); break;
    case "mnext": UI.month = addMonth(UI.month, 1); render(); break;
    case "tip": { const L = chartSVG.last, i = Number(el.dataset.i), s = L.series[i];
      document.getElementById("chartTip").textContent = `${mLabel(L.months[i])}：売上 ${yen(s.sales)}／コスト ${yen(s.cost)}／純利益 ${yen(s.profit)}`; break; }
    case "csv": download("seller_sales_" + today() + ".csv", buildCSV(csvRows()), "text/csv;charset=utf-8"); break;
    case "complete": { e.stopPropagation(); const it = S.items.find(x => x.id === el.dataset.id);
      if (it){ it.st = "sold"; if (!it.soldDate) it.soldDate = today(); await saveState(); render(); toast("取引完了にしました"); } break; }
    case "edit": openEditor(el.dataset.id); break;
    case "mf": if (el.disabled) break; UI.masterF = el.dataset.f; render(); break;
    /* v1.2.0 §4 束ねる */
    case "selOn": UI.selMode = true; UI.sel = {}; UI.masterF = "stock"; render(); break;
    case "selOff": UI.selMode = false; UI.sel = {}; render(); break;
    case "selTap": { const id = el.dataset.id, it = S.items.find(x => String(x.id) === id);
      if (!it || it.st !== "stock"){ toast("束ねられるのは仕入れ済みの商品だけです"); break; }
      if (UI.sel[id]) delete UI.sel[id]; else UI.sel[id] = 1;
      const on = !!UI.sel[id], n = Object.keys(UI.sel).length; el.classList.toggle("sel", on); el.setAttribute("aria-pressed", String(on));
      const sn = document.getElementById("selN"); if (sn) sn.textContent = n + "件 選択中";
      const bm = document.querySelector('[data-act="bundleMake"]'); if (bm) bm.disabled = n < 2; break; }
    case "bundleMake": if (!el.disabled) bundleMake(); break;
    case "bundleDo": bundleDo(); break;
    case "unbundle": unbundleAsk(); break;
    case "unbundleGo": unbundleGo(); break;
    /* v1.2.0 §3 読み取りで登録 */
    /* v1.3.0 §2 読み取りで登録（SSS の A.regScan / regIsbn / regManual / regPendOk / regPendManual / regPendSkip / regForm と同じ） */
    case "regOpen": regOpen(); break;
    case "regClose": regClose(); break;
    case "regScan": if (Scan.on){ stopScan(); break; } if (!regParams()) break; startScan("#regCam", regCode).then(() => { const b = $("#regScanBtn"); if (b && Scan.on) b.textContent = "■ 読み取り停止"; }); break;
    case "regIsbn": { const v = normCode($("#rgIsbn").value); if (!/^\d{13}$/.test(v) && !/^\d{8}$/.test(v)){ toast("ISBN／JANを確認してください"); break; } $("#rgIsbn").value = ""; regCode(v); break; }
    case "regManual": { const n = ($("#rgName").value || "").trim(); if (!n){ toast("商品名を入力してください"); break; } const d = regDup("", n); if (d.length && !confirm(`同じ巻がすでに在庫にあります（${d.map(x => x.name).join("、")}）。それでも登録しますか？`)) break; if (regAdd({title:n})) $("#rgName").value = ""; break; }
    case "regPendOk": { const P = REG && REG.pend; if (!P) break; REG.pend = null; regAdd(P); regPendShow(); break; }
    case "regPendManual": { const P = REG && REG.pend; const n = (($("#rgPendName") || {}).value || "").trim(); if (!P || !n){ toast("商品名を入力してください"); break; } REG.pend = null; regAdd({code:P.code, title:n}); regPendShow(); break; }
    case "regPendSkip": if (REG) REG.pend = null; regPendShow(); break;
    case "regForm": { const st = S.settings.store || ""; if (Scan.on) stopScan(); REG = null; openEditor(null, {st:"stock", date:today(), store:st}); break; }
    case "isbnGo": isbnGo(); break;
    case "manual": closeModal(); openEditor(null, {}); break;
    case "mclose": closeModal(); break;
    case "edClose": closeEditor(); break;
    case "edSave": edSave(); break;
    case "edDelete": if (!el.disabled) edDelete(); break;
    case "edDeleteGo": edDeleteGo(); break;
    case "cchip": el.classList.toggle("on"); break;
    case "toolSw": UI.tool = el.dataset.v === "calc" ? "calc" : "tpl"; render(); break;
    case "tChip": UI.tcat = el.dataset.v; render(); break;
    case "tplCopy": tplUse(el.dataset.id); break;
    case "fillGo": fillGo(); break;
    case "tplPin": tplPin(el.dataset.id); break;
    case "tplEdit": tplOpen(el.dataset.id); break;
    case "tplNew": tplOpen(null); break;
    case "tplSave": tplSave(); break;
    case "tplDel": tplDel(); break;
    case "tplDelGo": tplDelGo(); break;
    case "insVar": { const ta = document.getElementById("tB"); if (!ta) break; const a0 = ta.selectionStart ?? ta.value.length, a1 = ta.selectionEnd ?? a0; ta.value = ta.value.slice(0, a0) + el.dataset.v + ta.value.slice(a1); ta.focus(); const p = a0 + el.dataset.v.length; try { ta.setSelectionRange(p, p); } catch (_) {} break; }
    case "calcRun": calcRun(); break;
    case "calcClear": calcReset(); render(); break;
    case "setSave": settingsSave(); break;
    case "export": { const j = buildExport(); download("seller_backup_" + today() + ".json", JSON.stringify(j, null, 1), "application/json"); toast("書き出しました（" + j.data.items.length + "件）"); break; }
    case "restore": document.getElementById("restoreFile").click(); break;
    case "driveSync": driveClick(); break;
    case "rsCancel": RESTORE = null; closeModal(); break;
    case "rsStep2": restoreStep2(); break;
    case "rsGo": restoreGo(); break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.closest && e.target.closest(".pst")){ memoInput(e.target); return; }
  if (e.target.id === "salesQ"){
    UI.salesQ = e.target.value;
    const pos = e.target.selectionStart; renderSales();
    const n = document.getElementById("salesQ"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {}
    return;
  }
  if (e.target.closest && e.target.closest("#edForm")){
    if (e.target.name === "soldCh"){ const c = S.settings.ch[e.target.value]; if (c) document.querySelector('#edForm [name="feeRate"]').value = c.fee; }
    edRecalc();
    return;
  }
  if ((e.target.id === "bunLo" || e.target.id === "bunHi") && BUN){
    const ms = BUN.ids.map(id => S.items.find(x => String(x.id) === id)).filter(Boolean), pv = document.getElementById("bunPrev");
    if (pv && ms.length) pv.textContent = setName(ms, document.getElementById("bunLo").value.trim(), document.getElementById("bunHi").value.trim());
    return;
  }
  if (e.target.id === "tq"){ UI.tq = e.target.value; document.getElementById("tplList").innerHTML = tplList(); return; }
  if (e.target.dataset && e.target.dataset.fv !== undefined && FILL){ const t = S.templates.find(x => String(x.id) === FILL.id); const pv = document.getElementById("fillPv"); if (t && pv) pv.textContent = fillText(tBody(t), FILL.vs, fillVals()); return; }
  if (e.target.dataset && e.target.dataset.c && C){ C[e.target.dataset.c] = e.target.value; calcLive(); return; }
});
document.addEventListener("change", (e) => {
  if (e.target.closest && e.target.closest(".pst")){ phChange(e); return; }
  if (e.target.dataset && e.target.dataset.cset) calcSetSave(e.target.dataset.cset, e.target.value);
});
document.addEventListener("toggle", (e) => {
  const k = e.target.dataset && e.target.dataset.fold; if (!k) return;
  if (e.target.closest && e.target.closest(".pst")) PUI[k] = e.target.open; else UI[k] = e.target.open;
}, true);
document.getElementById("restoreFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (f) restoreFromText(await f.text());
});

/* ---------- 起動 ---------- */
const ready = (async () => {
  try { await loadState(); } catch (e) { toast("保存領域を開けません: " + e.message); }
  try { await loadLocal(); } catch (e) {}
  try { const v = await idbGet("meta", "driveLastSyncAt"); DRIVE.last = typeof v === "string" ? v : null; } catch (e) {}
  C = calcNew();
  setTab("analysis");
})();
window.__seller = {get S(){ return S; }, ready, calc, monthAgg, parseBackup, buildExport, buildCSV, restoreFromText, setTab, openEditor, UI, APP_VER, lookupBiblio,
  get LOC(){ return LOC; }, get ED(){ return ED; }, get lastCopy(){ return LAST_COPY; }, calcProfit, perVol, capOf, needCalc, estCalc, csvRows,
  invAgg, memberSet, membersOf, mixedName, setName, workKey, itemKey, normCode, ean13ok, decodeImageData, regCode, regDup, get REG(){ return REG; }, get Scan(){ return Scan; },
  // v1.3.0 確認用（写真・読み取り）
  PUI, phOf, phBadge, progress, reqKeys, canon, condText, bannerText, bannerDefault, bnToggle, renderEdit, blurBg, makeMask, withBanner, collage, exportFiles, photosReady, isBook, fetchBiblio, CHART_KEYS,
  get SEGOK(){ return SEGOK; }, loadSeg, onCode, startScan, stopScan, regOpen, regPendShow, shootHTML, PA, phPeek, guessFlags, regen, mkDup, finalize,
  __setSeg(seg){ SEGP = seg ? Promise.resolve(seg) : null; SEGOK = !!seg; },
  // v1.5.0 確認用（ドライブ同期）
  mergeDriveData, jcanon, driveNorm, driveSync, driveClick, gsiInit, DRIVE, GSI_CLIENT_ID, DRIVE_SCOPE};
gsiLoad();   // v1.5.0 GIS の読み込み（失敗しても他の機能には影響しない）
</script>
